[package]
name = "xkbcommon-dl"
version = "0.4.999"
documentation = "https://docs.rs/xkbcommon-dl/"
repository = "https://github.com/rust-windowing/xkbcommon-dl"
authors = ["Francesca Frangipane <francesca@comfysoft.net>"]
license = "MIT"
description = "Dynamically loaded xkbcommon and xkbcommon-x11 Rust bindings."
edition = "2021"
rust-version = "1.64"

[badges]

[features]
default = ["dlopen-xkbcommon"]
x11 = []
dlopen-xkbcommon = []

[dependencies]
bitflags = "2.3.1"
dlib = { git = "https://github.com/q3k/dlib", rev = "ac5a4822263a2e5eaf2c635eaff3a3b7b51eec3b" }
log = "0.4"
once_cell = "1.17"
xkeysym = "0.2.0"

[build-dependencies]
pkg-config = "0.3.32"
